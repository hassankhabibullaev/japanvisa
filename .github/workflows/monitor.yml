name: monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # watchdog: keeps one run queued so the chain never dies

# at most one running job; a newly queued run waits its turn (no overlap, no gap)
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_TG_USER: ${{ secrets.CALLMEBOT_TG_USER }}
      MAX_RUNTIME_SECONDS: "20400"   # exit after 5h40m; the chained run takes over
    steps:
      - uses: actions/checkout@v4
      - run: python3 monitor.py
      - name: chain next run
        if: always()
        run: gh workflow run monitor.yml
        env:
          GH_TOKEN: ${{ github.token }}
