name: drill
# Fire-drill rehearsal: press "Run workflow" in the Actions tab. For up to
# 5 minutes it behaves exactly like a real opening — rings + messages every
# ~minute, tagged [TEST] — until you press the STOP button in Telegram.
on: workflow_dispatch
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_TG_USER: ${{ secrets.CALLMEBOT_TG_USER }}
      DRILL: "1"
      MAX_RUNTIME_SECONDS: "300"
      INTERVAL_MIN: "15"
      INTERVAL_MAX: "25"
    steps:
      - uses: actions/checkout@v4
      - run: python3 monitor.py
