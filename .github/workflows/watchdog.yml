name: watchdog

# Answers one question every 10 minutes: is the monitor actually running?
# If it is not, it says so on Telegram and starts it again. This is what turns a
# dead runner from silence into a message.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Is the monitor alive?
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          alive=$(gh run list --workflow=monitor.yml --repo "$REPO" \
                    --status in_progress --limit 1 --json databaseId --jq 'length')
          queued=$(gh run list --workflow=monitor.yml --repo "$REPO" \
                    --status queued --limit 1 --json databaseId --jq 'length')
          echo "in_progress=$alive queued=$queued"
          if [ "$alive" = "0" ] && [ "$queued" = "0" ]; then
            python3 - <<'PY'
          import os, urllib.parse, urllib.request
          url = "https://api.telegram.org/bot%s/sendMessage" % os.environ["TELEGRAM_BOT_TOKEN"]
          text = (
              "\u26a0 NEEDS ATTENTION\n"
              "\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n"
              "The monitor is NOT running.\n\n"
              "No run is active or queued, so nothing is being watched. Starting one now. "
              "If this repeats, the workflow itself needs looking at.")
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=20).read()
          PY
            gh workflow run monitor.yml --repo "$REPO"
          fi
